[package]
name = "vfbreader"
version = "0.1.6"
edition = "2021"
description = "Library for handling FontLab Studio 5 VFB files"
readme = "../README.md"
repository = "https://github.com/jenskutilek/vfbLib-rust"
license = "GPL-3.0-or-later OR LGPL-3.0-or-later"
categories = ["parsing"]

[dependencies]
bitflags = { version = "2.10.0", features = ["serde"] }
encoding_rs = "0.8.41"
error-stack = "0.8.0"
font-types = { version = "0.12.5", features = ["serde"] }
hex = "0.4.3"
log = "0.4.34"
phf = { version = "0.14.0", features = ["macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
vfb-macros = { path = "../vfb-macros", version = "0.1.5" }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
